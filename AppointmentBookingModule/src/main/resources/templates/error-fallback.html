<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error - Haircare Salon</title>
    <link href="https://fonts.googleapis.com/css?family=Barlow+Condensed:300,400,500,600,700" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #101010;
            color: #fff;
            font-family: 'Barlow Condensed', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .error-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(191, 146, 91, 0.2);
            padding: 50px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
        }
        h1 { color: #bf925b; font-size: 80px; font-weight: 700; margin-bottom: 10px; }
        .btn-gold {
            background: #bf925b;
            color: #000;
            font-weight: 700;
            padding: 12px 30px;
            border-radius: 5px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
        }
        .btn-gold:hover { background: #d4af37; transform: translateY(-3px); }
    </style>
</head>
<body>
    <div class="error-card">
        <h1 th:text="${status}">Error</h1>
        <h3 class="mb-4 text-uppercase" style="letter-spacing: 3px;">Oops! Something went wrong</h3>
        <p class="text-muted mb-5" th:text="${error}">An unexpected error has occurred.</p>
        <a href="/static" class="btn-gold">Back to Homepage</a>
    </div>
</body>
</html>
