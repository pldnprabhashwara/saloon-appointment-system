<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Haircare - Professional Hair Care</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Barlow+Condensed:500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <link rel="stylesheet" href="/css/flaticon.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/appointments.css">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark ftco_navbar bg-dark ftco-navbar-light" id="ftco-navbar">
    <div class="container d-flex align-items-center">
        <a class="navbar-brand d-flex align-items-center" href="/">
            <span class="flaticon-scissors-in-a-hair-salon-badge me-2"></span>
            Haircare
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#ftco-nav" aria-controls="ftco-nav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="fa fa-bars"></span> Menu
        </button>
        <div class="collapse navbar-collapse" id="ftco-nav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a href="/" class="nav-link">Home</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="apptDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Appointments
                    </a>
                    <ul class="dropdown-menu shadow-lg border-0" aria-labelledby="apptDropdown" style="background: #101010; border-top: 2px solid #bf925b !important;">
                        <li><a class="dropdown-item py-2" href="/appointments/book" style="color: #fff;">Book Appointment</a></li>
                        <li><a class="dropdown-item py-2" href="/appointments" style="color: #fff;">My Bookings</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="appointment-footer py-4">
    <div class="container text-center">
        <div class="mb-3">
            <span class="me-3"><i class="fas fa-map-marker-alt text-gold me-2"></i>Malabe, Sri Lanka</span>
            <span class="me-3"><i class="fas fa-phone text-gold me-2"></i>+94 77 123 4567</span>
            <span><i class="fas fa-envelope text-gold me-2"></i>info@haircare.lk</span>
        </div>
        <p class="mb-0 text-muted small">Copyright &copy; 2026 All rights reserved | Haircare Salon</p>
    </div>
</footer>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="/js/appointments.js"></script>
</div>

</body>
</html>
