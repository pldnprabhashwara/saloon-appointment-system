<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Service</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Barlow+Condensed:500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/open-iconic-bootstrap.min.css">
    <link rel="stylesheet" href="/css/animate.css">
    <link rel="stylesheet" href="/css/ionicons.min.css">
    <link rel="stylesheet" href="/css/flaticon.css">
    <link rel="stylesheet" href="/css/icomoon.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark ftco_navbar bg-dark ftco-navbar-light" id="ftco-navbar">
        <div class="container">
            <a class="navbar-brand" href="/"><span class="flaticon-scissors-in-a-hair-salon-badge"></span>Haircare</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#ftco-nav">
                <span class="oi oi-menu"></span> Menu
            </button>
            <div class="collapse navbar-collapse" id="ftco-nav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a href="/" class="nav-link">Home</a></li>
                    <li class="nav-item active"><a href="/services" class="nav-link">Services</a></li>
                    <li class="nav-item"><a href="/user-list" class="nav-link">Users</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="hero-wrap hero-wrap-2" style="background-image: url('/images/bg-1.jpg');" data-stellar-background-ratio="0.5">
        <div class="overlay"></div>
        <div class="container">
            <div class="row no-gutters slider-text js-fullheight align-items-end justify-content-center">
                <div class="col-md-9 ftco-animate pb-5 text-center">
                    <h2 class="mb-0 bread">Edit Service</h2>
                    <p class="breadcrumbs">
                        <span class="mr-2"><a href="/">Home <i class="ion-ios-arrow-round-forward"></i></a></span>
                        <span class="mr-2"><a href="/services">Services <i class="ion-ios-arrow-round-forward"></i></a></span>
                        <span>Edit <i class="ion-ios-arrow-round-forward"></i></span>
                    </p>
                </div>
            </div>
        </div>
    </section>

    <section class="ftco-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-7 col-lg-6">

                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                        <span th:text="${error}"></span>
                        <button type="button" class="close" data-dismiss="alert"><span>&times;</span></button>
                    </div>

                    <div class="login-wrap p-4 p-md-5">
                        <h3 class="text-center mb-4">Edit Service</h3>

                        <div th:if="${service}" >
                            <p class="text-muted text-center">ID: <strong th:text="${service.serviceId}"></strong></p>

                            <form th:action="@{/services/edit/{id}(id=${service.serviceId})}" method="post">

                                <div class="form-group">
                                    <label for="serviceName">Service Name *</label>
                                    <input type="text" id="serviceName" name="serviceName"
                                           class="form-control rounded-left"
                                           th:value="${service.serviceName}" required>
                                </div>

                                <div class="form-group">
                                    <label for="category">Category *</label>
                                    <select id="category" name="category" class="form-control" required>
                                        <option value="Hair"   th:selected="${service.category == 'Hair'}">Hair</option>
                                        <option value="Skin"   th:selected="${service.category == 'Skin'}">Skin</option>
                                        <option value="Nail"   th:selected="${service.category == 'Nail'}">Nail</option>
                                        <option value="Makeup" th:selected="${service.category == 'Makeup'}">Makeup</option>
                                        <option value="Spa"    th:selected="${service.category == 'Spa'}">Spa</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label for="price">Price (Rs.) *</label>
                                    <input type="number" id="price" name="price"
                                           class="form-control"
                                           th:value="${service.price}"
                                           min="0" step="0.01" required>
                                </div>

                                <div class="form-group">
                                    <label for="durationMinutes">Duration (minutes) *</label>
                                    <input type="number" id="durationMinutes" name="durationMinutes"
                                           class="form-control"
                                           th:value="${service.durationMinutes}"
                                           min="5" max="480" required>
                                </div>

                                <div class="form-group">
                                    <label for="description">Description</label>
                                    <textarea id="description" name="description"
                                              class="form-control" rows="3"
                                              th:text="${service.description}"></textarea>
                                </div>

                                <div class="form-group d-flex">
                                    <button type="submit" class="btn btn-warning py-3 px-5 mr-3">
                                        Update Service
                                    </button>
                                    <a href="/services" class="btn btn-secondary py-3 px-5">Cancel</a>
                                </div>
                            </form>
                        </div>

                        <div th:unless="${service}">
                            <p class="text-center text-danger">Service not found.</p>
                            <a href="/services" class="btn btn-primary btn-block">Back to Services</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="ftco-footer ftco-section">
        <div class="container">
            <div class="row">
                <div class="col-md-12 text-center">
                    <p>Haircare Salon &copy; 2024</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="/js/jquery.min.js"></script>
    <script src="/js/popper.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
