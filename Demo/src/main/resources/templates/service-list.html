<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Salon Services</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Barlow+Condensed:500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/open-iconic-bootstrap.min.css">
    <link rel="stylesheet" href="/css/animate.css">
    <link rel="stylesheet" href="/css/owl.carousel.min.css">
    <link rel="stylesheet" href="/css/owl.theme.default.min.css">
    <link rel="stylesheet" href="/css/magnific-popup.css">
    <link rel="stylesheet" href="/css/aos.css">
    <link rel="stylesheet" href="/css/ionicons.min.css">
    <link rel="stylesheet" href="/css/bootstrap-datepicker.css">
    <link rel="stylesheet" href="/css/jquery.timepicker.css">
    <link rel="stylesheet" href="/css/flaticon.css">
    <link rel="stylesheet" href="/css/icomoon.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark ftco_navbar bg-dark ftco-navbar-light" id="ftco-navbar">
        <div class="container">
            <a class="navbar-brand" href="/"><span class="flaticon-scissors-in-a-hair-salon-badge"></span>Haircare</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#ftco-nav">
                <span class="oi oi-menu"></span> Menu
            </button>
            <div class="collapse navbar-collapse" id="ftco-nav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a href="/" class="nav-link">Home</a></li>
                    <li class="nav-item active"><a href="/services" class="nav-link">Services</a></li>
                    <li class="nav-item"><a href="/gallery" class="nav-link">Gallery</a></li>
                    <li class="nav-item"><a href="/about" class="nav-link">About</a></li>
                    <li class="nav-item"><a href="/contact" class="nav-link">Contact</a></li>
                    <li class="nav-item"><a href="/user-list" class="nav-link">Users</a></li>
                    <li class="nav-item"><a href="/services/add" class="nav-link">Add Service</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="hero-wrap hero-wrap-2" style="background-image: url('/images/bg-1.jpg');" data-stellar-background-ratio="0.5">
        <div class="overlay"></div>
        <div class="container">
            <div class="row no-gutters slider-text js-fullheight align-items-end justify-content-center">
                <div class="col-md-9 ftco-animate pb-5 text-center">
                    <h2 class="mb-0 bread">Salon Services</h2>
                    <p class="breadcrumbs">
                        <span class="mr-2"><a href="/">Home <i class="ion-ios-arrow-round-forward"></i></a></span>
                        <span>Services <i class="ion-ios-arrow-round-forward"></i></span>
                    </p>
                </div>
            </div>
        </div>
    </section>

    <section class="ftco-section">
        <div class="container">

            <!-- Alerts -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${success}"></span>
                <button type="button" class="close" data-dismiss="alert"><span>&times;</span></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${error}"></span>
                <button type="button" class="close" data-dismiss="alert"><span>&times;</span></button>
            </div>

            <!-- Search & Filter Bar -->
            <div class="row mb-4">
                <div class="col-md-6">
                    <form method="get" action="/services" class="d-flex">
                        <input type="text" name="search" class="form-control mr-2"
                               placeholder="Search services..." th:value="${search}">
                        <button type="submit" class="btn btn-primary">Search</button>
                    </form>
                </div>
                <div class="col-md-4">
                    <form method="get" action="/services">
                        <select name="category" class="form-control" onchange="this.form.submit()">
                            <option value="">-- All Categories --</option>
                            <option value="Hair" th:selected="${selectedCategory == 'Hair'}">Hair</option>
                            <option value="Skin" th:selected="${selectedCategory == 'Skin'}">Skin</option>
                            <option value="Nail" th:selected="${selectedCategory == 'Nail'}">Nail</option>
                            <option value="Makeup" th:selected="${selectedCategory == 'Makeup'}">Makeup</option>
                            <option value="Spa" th:selected="${selectedCategory == 'Spa'}">Spa</option>
                        </select>
                    </form>
                </div>
                <div class="col-md-2 text-right">
                    <a href="/services/add" class="btn btn-success btn-block">+ Add Service</a>
                </div>
            </div>

            <!-- Services Table -->
            <div class="row">
                <div class="col-md-12">
                    <div class="table-responsive">
                        <table class="table table-hover table-striped">
                            <thead class="thead-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Service Name</th>
                                    <th>Category</th>
                                    <th>Price</th>
                                    <th>Duration</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(services)}">
                                    <td colspan="7" class="text-center text-muted py-4">No services found.</td>
                                </tr>
                                <tr th:each="service : ${services}">
                                    <td th:text="${service.serviceId}"></td>
                                    <td th:text="${service.serviceName}"></td>
                                    <td>
                                        <span class="badge badge-info" th:text="${service.category}"></span>
                                    </td>
                                    <td th:text="${service.formattedPrice}"></td>
                                    <td th:text="${service.formattedDuration}"></td>
                                    <td>
                                        <span th:if="${service.active}" class="badge badge-success">Active</span>
                                        <span th:unless="${service.active}" class="badge badge-secondary">Inactive</span>
                                    </td>
                                    <td>
                                        <a th:href="@{/services/edit/{id}(id=${service.serviceId})}"
                                           class="btn btn-sm btn-warning">Edit</a>

                                        <form th:action="@{/services/deactivate/{id}(id=${service.serviceId})}"
                                              method="post" style="display:inline;"
                                              th:if="${service.active}">
                                            <button type="submit" class="btn btn-sm btn-secondary"
                                                    onclick="return confirm('Deactivate this service?')">
                                                Deactivate
                                            </button>
                                        </form>

                                        <form th:action="@{/services/delete/{id}(id=${service.serviceId})}"
                                              method="post" style="display:inline;">
                                            <button type="submit" class="btn btn-sm btn-danger"
                                                    onclick="return confirm('Delete this service permanently?')">
                                                Delete
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <p class="text-muted" th:text="'Total: ' + ${totalCount} + ' service(s)'"></p>
                </div>
            </div>
        </div>
    </section>

    <footer class="ftco-footer ftco-section">
        <div class="container">
            <div class="row">
                <div class="col-md-12 text-center">
                    <p>Haircare Salon &copy; 2024</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="/js/jquery.min.js"></script>
    <script src="/js/jquery-migrate-3.0.1.min.js"></script>
    <script src="/js/popper.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
    <script src="/js/jquery.easing.1.3.js"></script>
    <script src="/js/jquery.waypoints.min.js"></script>
    <script src="/js/jquery.stellar.min.js"></script>
    <script src="/js/owl.carousel.min.js"></script>
    <script src="/js/jquery.magnific-popup.min.js"></script>
    <script src="/js/aos.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
