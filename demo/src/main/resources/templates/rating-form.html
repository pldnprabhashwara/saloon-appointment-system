<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Submit Rating - Haircare Salon</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Barlow+Condensed:500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/open-iconic-bootstrap.min.css">
    <link rel="stylesheet" href="/css/animate.css">
    <link rel="stylesheet" href="/css/owl.carousel.min.css">
    <link rel="stylesheet" href="/css/owl.theme.default.min.css">
    <link rel="stylesheet" href="/css/magnific-popup.css">
    <link rel="stylesheet" href="/css/aos.css">
    <link rel="stylesheet" href="/css/ionicons.min.css">
    <link rel="stylesheet" href="/css/flaticon.css">
    <link rel="stylesheet" href="/css/icomoon.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .form-card { background:#fff; border-radius:10px; box-shadow:0 8px 40px rgba(0,0,0,0.10); padding:40px; }
        .form-control:focus { border-color:#bf925b; box-shadow:0 0 0 0.2rem rgba(191,146,91,0.25); }
        .btn-gold { background:#bf925b; color:#fff; border:none; font-weight:600; transition:background 0.2s; }
        .btn-gold:hover { background:#a97a45; color:#fff; }
        .star-rating { display:flex; flex-direction:row-reverse; justify-content:flex-end; gap:6px; }
        .star-rating input { display:none; }
        .star-rating label { font-size:2rem; color:#ddd; cursor:pointer; transition:color 0.15s; }
        .star-rating input:checked ~ label,
        .star-rating label:hover,
        .star-rating label:hover ~ label { color:#bf925b; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark ftco_navbar bg-dark ftco-navbar-light" id="ftco-navbar">
        <div class="container">
            <a class="navbar-brand" href="/"><span class="flaticon-scissors-in-a-hair-salon-badge"></span>Haircare</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#ftco-nav" aria-controls="ftco-nav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="oi oi-menu"></span> Menu
            </button>
            <div class="collapse navbar-collapse" id="ftco-nav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a href="/" class="nav-link">Home</a></li>
                    <li class="nav-item"><a href="/services" class="nav-link">Services</a></li>
                    <li class="nav-item"><a href="/stylist" class="nav-link">Stylist</a></li>
                    <li class="nav-item active"><a href="/ratings" class="nav-link">Ratings</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="moreDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">More</a>
                        <div class="dropdown-menu shadow-lg border-0" aria-labelledby="moreDropdown" style="background:#101010;border-top:2px solid #bf925b !important;">
                            <a class="dropdown-item py-2" href="/gallery" style="color:#fff;">Gallery</a>
                            <a class="dropdown-item py-2" href="/about" style="color:#fff;">About Us</a>
                            <a class="dropdown-item py-2" href="/blog" style="color:#fff;">Blog</a>
                        </div>
                    </li>
                    <li class="nav-item"><a href="/contact" class="nav-link">Contact</a></li>
                    <li class="nav-item"><a href="/admin/login" class="nav-link">Admin</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="hero-wrap hero-wrap-2" style="background-image: url('/images/bg-1.jpg');" data-stellar-background-ratio="0.5">
        <div class="overlay"></div>
        <div class="container">
            <div class="row no-gutters slider-text js-fullheight align-items-end justify-content-center">
                <div class="col-md-9 ftco-animate pb-5 text-center">
                    <h2 class="mb-0 bread">Leave a Review</h2>
                    <p class="breadcrumbs"><span class="mr-2"><a href="/">Home <i class="ion-ios-arrow-round-forward"></i></a></span><span class="mr-2"><a href="/ratings">Ratings <i class="ion-ios-arrow-round-forward"></i></a></span><span>Submit</span></p>
                </div>
            </div>
        </div>
    </section>

    <section class="ftco-section" style="background:#f4f4f4;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-7">
                    <div class="form-card">
                        <h4 class="mb-4" style="font-weight:700;color:#333;">Share Your Experience</h4>

                        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                            <span th:text="${error}"></span>
                            <button type="button" class="close" data-dismiss="alert"><span>&times;</span></button>
                        </div>

                        <form method="POST" action="/ratings/submit">
                            <div class="form-group mb-3">
                                <label>Your Name <span style="color:red;">*</span></label>
                                <input type="text" class="form-control" name="userName" th:value="${userName}" placeholder="Enter your name" required>
                            </div>
                            <div class="form-group mb-3">
                                <label>Email Address <span style="color:red;">*</span></label>
                                <input type="email" class="form-control" name="userEmail" th:value="${userEmail}" placeholder="Enter your email" required>
                            </div>
                            <div class="form-group mb-3">
                                <label>Service Received <span style="color:red;">*</span></label>
                                <select class="form-control" name="serviceName" required>
                                    <option value="">-- Select a Service --</option>
                                    <option value="Haircut"   th:selected="${serviceName == 'Haircut'}">Haircut</option>
                                    <option value="Coloring"  th:selected="${serviceName == 'Coloring'}">Coloring</option>
                                    <option value="Styling"   th:selected="${serviceName == 'Styling'}">Styling</option>
                                    <option value="Treatment" th:selected="${serviceName == 'Treatment'}">Treatment</option>
                                    <option value="Other"     th:selected="${serviceName == 'Other'}">Other</option>
                                </select>
                            </div>
                            <div class="form-group mb-3">
                                <label>Star Rating <span style="color:red;">*</span></label>
                                <div class="star-rating">
                                    <input type="radio" name="stars" id="s5" value="5" th:checked="${stars == 5}"><label for="s5" title="5 stars">&#9733;</label>
                                    <input type="radio" name="stars" id="s4" value="4" th:checked="${stars == 4}"><label for="s4" title="4 stars">&#9733;</label>
                                    <input type="radio" name="stars" id="s3" value="3" th:checked="${stars == 3}"><label for="s3" title="3 stars">&#9733;</label>
                                    <input type="radio" name="stars" id="s2" value="2" th:checked="${stars == 2}"><label for="s2" title="2 stars">&#9733;</label>
                                    <input type="radio" name="stars" id="s1" value="1" th:checked="${stars == 1}" checked><label for="s1" title="1 star">&#9733;</label>
                                </div>
                            </div>
                            <div class="form-group mb-4">
                                <label>Your Comment <span style="color:red;">*</span></label>
                                <textarea class="form-control" name="comment" rows="4" placeholder="Tell us about your experience..." required th:text="${comment}"></textarea>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-gold px-4">Submit Review</button>
                                <a href="/ratings" class="btn btn-outline-secondary px-4">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="ftco-footer ftco-section">
        <div class="container">
            <div class="row"><div class="col-md-12 text-center"><p>Copyright &copy;<script>document.write(new Date().getFullYear());</script> All rights reserved | Haircare</p></div></div>
        </div>
    </footer>

    <div id="ftco-loader" class="show fullscreen"><svg class="circular" width="48px" height="48px"><circle class="path-bg" cx="24" cy="24" r="22" fill="none" stroke-width="4" stroke="#eeeeee"/><circle class="path" cx="24" cy="24" r="22" fill="none" stroke-width="4" stroke-miterlimit="10" stroke="#F96D00"/></svg></div>
    <script src="/js/jquery.min.js"></script>
    <script src="/js/jquery-migrate-3.0.1.min.js"></script>
    <script src="/js/popper.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
    <script src="/js/jquery.easing.1.3.js"></script>
    <script src="/js/jquery.waypoints.min.js"></script>
    <script src="/js/jquery.stellar.min.js"></script>
    <script src="/js/owl.carousel.min.js"></script>
    <script src="/js/jquery.magnific-popup.min.js"></script>
    <script src="/js/aos.js"></script>
    <script src="/js/jquery.animateNumber.min.js"></script>
    <script src="/js/scrollax.min.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
