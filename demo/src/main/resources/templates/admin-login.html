<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Login - Haircare Ratings</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Barlow+Condensed:500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/open-iconic-bootstrap.min.css">
    <link rel="stylesheet" href="/css/animate.css">
    <link rel="stylesheet" href="/css/owl.carousel.min.css">
    <link rel="stylesheet" href="/css/owl.theme.default.min.css">
    <link rel="stylesheet" href="/css/magnific-popup.css">
    <link rel="stylesheet" href="/css/aos.css">
    <link rel="stylesheet" href="/css/ionicons.min.css">
    <link rel="stylesheet" href="/css/flaticon.css">
    <link rel="stylesheet" href="/css/icomoon.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .admin-badge { display:inline-block; background:#bf925b; color:#fff; font-size:0.7rem; font-weight:700; letter-spacing:2px; text-transform:uppercase; padding:3px 10px; border-radius:20px; margin-bottom:12px; }
        .admin-card  { border:none; border-radius:10px; box-shadow:0 8px 40px rgba(0,0,0,0.13); }
        .btn-admin   { background-color:#bf925b; color:#fff; font-weight:600; border:none; transition:background 0.3s; }
        .btn-admin:hover { background-color:#a97a45; color:#fff; }
        .form-control:focus { border-color:#bf925b; box-shadow:0 0 0 0.2rem rgba(191,146,91,0.25); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark ftco_navbar bg-dark ftco-navbar-light" id="ftco-navbar">
        <div class="container">
            <a class="navbar-brand" href="/"><span class="flaticon-scissors-in-a-hair-salon-badge"></span>Haircare</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a href="/" class="nav-link">Home</a></li>
                    <li class="nav-item"><a href="/ratings" class="nav-link">Ratings</a></li>
                    <li class="nav-item active"><a href="/admin/login" class="nav-link">Admin</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="hero-wrap hero-wrap-2" style="background-image: url('/images/bg-1.jpg');" data-stellar-background-ratio="0.5">
        <div class="overlay"></div>
        <div class="container">
            <div class="row no-gutters slider-text js-fullheight align-items-end justify-content-center">
                <div class="col-md-9 ftco-animate pb-5 text-center">
                    <h2 class="mb-0 bread">Admin Login</h2>
                    <p class="breadcrumbs"><span class="mr-2"><a href="/">Home <i class="ion-ios-arrow-round-forward"></i></a></span> <span>Admin</span></p>
                </div>
            </div>
        </div>
    </section>

    <section class="ftco-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="card admin-card">
                        <div class="card-body p-5">
                            <div class="text-center mb-4">
                                <span class="admin-badge">Administrator</span>
                                <h3 class="card-title mb-0">Admin Access</h3>
                                <p class="text-muted" style="font-size:0.9rem;">Ratings management panel</p>
                            </div>
                            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                                <span th:text="${error}"></span>
                                <button type="button" class="close" data-dismiss="alert"><span>&times;</span></button>
                            </div>
                            <form method="POST" action="/admin/login">
                                <div class="form-group mb-3">
                                    <label>Admin Email</label>
                                    <input type="email" class="form-control" name="email" placeholder="Enter admin email" required>
                                </div>
                                <div class="form-group mb-4">
                                    <label>Password</label>
                                    <input type="password" class="form-control" name="password" placeholder="Enter admin password" required>
                                </div>
                                <button type="submit" class="btn btn-admin w-100">Login as Admin</button>
                            </form>
                            <hr>
                            <div class="text-center"><a href="/ratings" class="text-muted" style="font-size:0.85rem;">Back to Ratings</a></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="ftco-footer ftco-section">
        <div class="container"><div class="row"><div class="col-md-12 text-center"><p>Copyright &copy;<script>document.write(new Date().getFullYear());</script> All rights reserved | Haircare Admin</p></div></div></div>
    </footer>

    <div id="ftco-loader" class="show fullscreen"><svg class="circular" width="48px" height="48px"><circle class="path-bg" cx="24" cy="24" r="22" fill="none" stroke-width="4" stroke="#eeeeee"/><circle class="path" cx="24" cy="24" r="22" fill="none" stroke-width="4" stroke-miterlimit="10" stroke="#F96D00"/></svg></div>
    <script src="/js/jquery.min.js"></script>
    <script src="/js/jquery-migrate-3.0.1.min.js"></script>
    <script src="/js/popper.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
    <script src="/js/jquery.easing.1.3.js"></script>
    <script src="/js/jquery.waypoints.min.js"></script>
    <script src="/js/jquery.stellar.min.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
